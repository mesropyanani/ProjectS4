<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student's Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #4A90E2;
        }
        p {
            font-size: 1.2rem;
            color: #666;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .feature-card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 250px;
            text-align: center;
        }
        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .feature-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }
        .feature-description {
            font-size: 1rem;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Student's Assistant</h1>
        <p>Your personal study helper — easy, fast and reliable.</p>
    </header>

    <section class="features">
        <div class="feature-card">
            <div class="feature-icon">📘</div>
            <div class="feature-title">Access All Textbooks</div>
            <div class="feature-description">Find all your school materials in one place.</div>
        </div>

        <div class="feature-card">
            <div class="feature-icon">🎥</div>
            <div class="feature-title">Learn With Videos</div>
            <div class="feature-description">Understand topics faster through curated tutorials.</div>
        </div>

        <div class="feature-card">
            <div class="feature-icon">💬</div>
            <div class="feature-title">Chat With Teachers</div>
            <div class="feature-description">Get your questions answered instantly.</div>
        </div>
    </section>

</body>
</html>
